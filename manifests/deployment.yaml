apiVersion: apps/v1
kind: Deployment
metadata:
  name: heart-disease-deployment
  labels:
    app: heart-disease
spec:
  replicas: 3
  selector:
    matchLabels:
      app: heart-disease
  template:
    metadata:
      labels:
        app: heart-disease
    spec:
      containers:
      - name: heart-disease
        image: heart-disease:v1.0.0
        imagePullPolicy: Never # Use the local image
        ports:
        - containerPort: 5000
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10